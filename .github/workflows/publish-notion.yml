name: Publicar Newsletter en Notion

on:
  workflow_dispatch:
  push:
    paths:
      - "newsletters/*.md"
    branches:
      - main
      - claude/funny-brown-GXqEH
      - claude/funny-brown-1ejtza

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar en Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PARENT_PAGE_ID: ${{ secrets.PARENT_PAGE_ID }}
        run: |
          OUTPUT=$(python3 publish_to_notion.py)
          echo "$OUTPUT"
          echo "### Pagina Notion creada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" | grep "URL:" | sed 's/URL: /🔗 **Notion:** /' >> $GITHUB_STEP_SUMMARY
